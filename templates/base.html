<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RoboRetail - Your Robot Marketplace{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; line-height: 1.6; }
        header { background: #333; color: #fff; padding: 1rem; }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        nav h1 { font-size: 1.5rem; }
        nav ul { display: flex; list-style: none; gap: 1rem; }
        nav a { color: #fff; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .search-bar { margin: 1rem 0; }
        .search-bar input { padding: 0.5rem; width: 300px; }
        .search-bar button { padding: 0.5rem 1rem; background: #333; color: #fff; border: none; cursor: pointer; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem; margin: 2rem 0; }
        .product-card { border: 1px solid #ddd; padding: 1rem; border-radius: 5px; }
        .product-card h3 { margin: 0.5rem 0; }
        .product-card .price { color: #e74c3c; font-size: 1.2rem; font-weight: bold; }
        .product-card a { display: inline-block; margin-top: 1rem; padding: 0.5rem 1rem; background: #3498db; color: #fff; text-decoration: none; border-radius: 3px; }
        .btn { padding: 0.5rem 1rem; background: #3498db; color: #fff; border: none; cursor: pointer; text-decoration: none; display: inline-block; border-radius: 3px; }
        .btn-danger { background: #e74c3c; }
        form { max-width: 400px; }
        form input, form textarea { width: 100%; padding: 0.5rem; margin: 0.5rem 0; }
        .error { color: #e74c3c; margin: 1rem 0; }
        table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        table th, table td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
        table th { background: #f4f4f4; }
        .review { border: 1px solid #ddd; padding: 1rem; margin: 1rem 0; border-radius: 5px; }
        .review .rating { color: #f39c12; }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1>🤖 RoboRetail</h1>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/products">Products</a></li>
                {% if session.username %}
                    <li><a href="/profile">Profile</a></li>
                    {% if session.role == 'admin' %}
                        <li><a href="/admin">Admin</a></li>
                    {% endif %}
                    <li><a href="/logout">Logout ({{ session.username }})</a></li>
                {% else %}
                    <li><a href="/login">Login</a></li>
                    <li><a href="/register">Register</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
